workflows:
  android-workflow:
    name: Oneir Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.oneir.app"
    scripts:
      - name: Generate Android platform files (repo has no android/ folder yet)
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --org com.oneir --project-name oneir
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK (debug -- shows real errors on-device instead of a silent freeze)
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
